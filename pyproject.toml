[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docuflow"
version = "2.0.0"
description = "OCR processing + library management AI services"
requires-python = ">=3.10"
dependencies = [
    # Core OCR & API
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    # Document Processing
    "PyMuPDF>=1.26.0",
    "PyPDF2>=3.0.0",
    "pdfminer.six>=20221105",
    "pdfplumber>=0.10.0",
    "onnxruntime>=1.17.0",
    "onnx>=1.15.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "tenacity>=8.2.0",
    "babeldoc>=0.1.0",
    "Pillow>=10.0.0",
    "python-docx>=1.1.0",
    "docling-slim[convert-core,format-pdf,parse]>=2.36.0",
    "docling-parse>=7.0.0",
    "docling-ibm-models>=3.0.0",
    "transformers>=4.40.0",
    # Database
    "SQLAlchemy>=2.0.0",
    # Configuration
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # PageIndex Dependencies
    "tiktoken>=0.5.0",
    "PyYAML>=6.0.0",
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<5.0",
    "python-multipart>=0.0.6",
    # Language Detection
    "langdetect>=1.0.9",
    # Keyword Extraction
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
docuflow-init-db = "scripts.init_db:main"

[tool.setuptools.packages.find]
exclude = [".venv*", "tests*", "docs*", "test_docs*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["api", "config", "core", "data", "services", "serving", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--verbose",
    "--cov=core",
    "--cov=data",
    "--cov=utils",
    "--cov=services",
    "--cov=api",
    "--cov=config",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]
