# POC: the library's Windows workstation, as a VM on the LAN (192.168.212.250).
#
#   docker network create -d macvlan --subnet=192.168.212.0/24 --gateway=192.168.212.1 \
#       --ip-range=192.168.212.248/29 -o parent=enp0s31f6 lan212
#   sudo bash lan_shim.sh up          # lets this host reach the macvlan addresses
#   docker compose up -d              # first boot downloads + installs Windows (~30-60 min)
#
# Web console: http://192.168.212.249:8006
services:
  windows:
    image: dockurr/windows
    container_name: docuflow-library-windows
    environment:
      VERSION: "11l"
      DHCP: "Y"                 # macvtap: Windows sits on the LAN itself (static IP set by oem/install.ps1)
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      DISK_SIZE: "64G"
      USERNAME: "thuvien"
      PASSWORD: "${WINVM_PASSWORD:-ThuVien#2026}"
    devices:
      - /dev/kvm
      - /dev/vhost-net
      - /dev/net/tun
    device_cgroup_rules:
      - "c *:* rwm"
    cap_add:
      - NET_ADMIN
    volumes:
      - ${WINVM_STORAGE:-/home/dell/Desktop/data/duy_dev/winvm/storage}:/storage
      - ./oem:/oem
    networks:
      lan212:
        ipv4_address: 192.168.212.249
    stop_grace_period: 2m
    restart: "no"

networks:
  lan212:
    external: true
